name: '🧩 iOS Build & Delivery'

on:
  workflow_call:
    inputs:
      environment:
        description: 'Choose environment to deploy (dev or prod)'
        required: true
        type: string
      delivery:
        description: 'Delivery to App Store Connect'
        required: false
        type: boolean
        default: false

env:
  FILE_IPA: GameLife-${{ inputs.environment }}.ipa
  PROVISION_PROFILE_NAME: ${{ inputs.environment == 'prod' && 'Game Life Distributed' || 'GameLife Test Profile' }}

jobs:
  build:
    name: '🏗️ Build'
    runs-on: macos-15
    timeout-minutes: 60
    environment: ${{ inputs.environment }}
    steps:
      - name: '🔍 Debug Workflow Context'
        run: |
          echo "============================================"
          echo "📊 Workflow Execution Context"
          echo "============================================"
          echo "Event name: ${{ github.event_name }}"
          echo "Ref: ${{ github.ref }}"
          echo "Ref name: ${{ github.ref_name }}"
          echo "Workflow: ${{ github.workflow }}"
          echo "Job: ${{ github.job }}"
          echo "Environment input: ${{ inputs.environment }}"
          echo "Environment (job-level): ${{ inputs.environment }}"
          echo "Actor: ${{ github.actor }}"
          echo "Run ID: ${{ github.run_id }}"
          echo "Run Number: ${{ github.run_number }}"
          echo "============================================"
          if [ "${{ github.event_name }}" = "workflow_call" ]; then
            echo "⚠️  This workflow is called via workflow_call"
            echo "⚠️  Ensure parent workflow uses 'secrets: inherit'"
          fi
          echo ""
      - name: '🚧 Check environment availability'
        run: |
          ENVIRONMENT="${{ inputs.environment }}"
          if [ "$ENVIRONMENT" != "prod" ] && [ "$ENVIRONMENT" != "test" ]; then
            echo "🚧 iOS build is only available for 'prod' and 'test' environments"
            echo "   Requested environment: '$ENVIRONMENT'"
            echo "   Skipping iOS build..."
            exit 1
          fi
          echo "✅ Environment '$ENVIRONMENT' is supported for iOS build"

      - name: 'Checkout repository'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          submodules: 'recursive'
          token: ${{ secrets.CICD_PAT }}

      - name: 'Setup Xcode'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'

      - name: 'Verify Xcode Selection'
        run: |
          echo "=== Xcode Installations ==="
          ls -la /Applications/ | grep -i xcode || echo "No Xcode found in /Applications"
          echo ""
          echo "=== Current Xcode Selection ==="
          xcode-select -p
          xcodebuild -version
          echo ""
          echo "=== Confirming Xcode Selection ==="
          SELECTED_XCODE=$(xcode-select -p)
          if [ -n "$SELECTED_XCODE" ]; then
            sudo xcode-select -s "$SELECTED_XCODE"
            echo "✅ Xcode confirmed at: $SELECTED_XCODE"
          fi

      - name: 'Install the Apple certificate and provisioning profile'
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_P12_PASSWORD }}
          PROVISION_PROFILE_BASE64: ${{ secrets.APPLE_PROVISION_PROFILE_BASE64 }}
          PROVISION_PROFILE_TEST_BASE64: ${{ secrets.APPLE_PROVISION_PROFILE_TEST_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          echo "============================================"
          echo "🔐 Certificate & Profile Installation Debug"
          echo "============================================"
          
          # 1) Verify secrets are present (without exposing values)
          echo "📊 Checking secret presence and size..."
          if [ -z "$BUILD_CERTIFICATE_BASE64" ]; then
            echo "❌ BUILD_CERTIFICATE_BASE64 is EMPTY"
            exit 1
          else
            echo "✅ BUILD_CERTIFICATE_BASE64 present (length: ${#BUILD_CERTIFICATE_BASE64})"
          fi
          
          if [ -z "$P12_PASSWORD" ]; then
            echo "❌ P12_PASSWORD is EMPTY"
            exit 1
          else
            echo "✅ P12_PASSWORD present (length: ${#P12_PASSWORD})"
          fi
          
          if [ -z "$KEYCHAIN_PASSWORD" ]; then
            echo "❌ KEYCHAIN_PASSWORD is EMPTY"
            exit 1
          else
            echo "✅ KEYCHAIN_PASSWORD present (length: ${#KEYCHAIN_PASSWORD})"
          fi
          
          ENVIRONMENT="${{ inputs.environment }}"
          if [ "$ENVIRONMENT" == 'test' ]; then
            if [ -z "$PROVISION_PROFILE_TEST_BASE64" ]; then
              echo "❌ PROVISION_PROFILE_TEST_BASE64 is EMPTY"
              exit 1
            else
              echo "✅ PROVISION_PROFILE_TEST_BASE64 present (length: ${#PROVISION_PROFILE_TEST_BASE64})"
            fi
          else
            if [ -z "$PROVISION_PROFILE_BASE64" ]; then
              echo "❌ PROVISION_PROFILE_BASE64 is EMPTY"
              exit 1
            else
              echo "✅ PROVISION_PROFILE_BASE64 present (length: ${#PROVISION_PROFILE_BASE64})"
            fi
          fi
          echo ""

          # Create variables
          echo "📁 Creating temporary files in $RUNNER_TEMP"
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # Import certificate and provisioning profile from secrets
          echo "🔓 Decoding certificate..."
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          DECODE_EXIT=$?
          if [ $DECODE_EXIT -ne 0 ]; then
            echo "❌ Failed to decode BUILD_CERTIFICATE_BASE64 (exit code: $DECODE_EXIT)"
            exit 1
          fi
          echo "✅ Certificate decoded"

          if [ "$ENVIRONMENT" == 'test' ]; then
            echo "🔓 Decoding test provisioning profile..."
            echo -n "$PROVISION_PROFILE_TEST_BASE64" | base64 --decode -o $PP_PATH
            echo "✅ Test environment selected"
          else
            echo "🔓 Decoding production provisioning profile..."
            echo -n "$PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH
            echo "✅ Production environment selected"
          fi
          echo ""

          # 2) Verify decoded files
          echo "📊 Verifying decoded files..."
          if [ ! -f "$CERTIFICATE_PATH" ]; then
            echo "❌ Certificate file not created: $CERTIFICATE_PATH"
            exit 1
          fi
          ls -lh "$CERTIFICATE_PATH"
          echo "File type: $(file "$CERTIFICATE_PATH")"
          CERT_SIZE=$(stat -f%z "$CERTIFICATE_PATH" 2>/dev/null || stat -c%s "$CERTIFICATE_PATH" 2>/dev/null || echo "0")
          echo "Certificate size: $CERT_SIZE bytes"
          if [ "$CERT_SIZE" -lt 100 ]; then
            echo "⚠️  Certificate file is suspiciously small (< 100 bytes)"
          fi
          echo ""
          
          if [ ! -f "$PP_PATH" ]; then
            echo "❌ Provisioning profile file not created: $PP_PATH"
            exit 1
          fi
          ls -lh "$PP_PATH"
          echo "File type: $(file "$PP_PATH")"
          PP_SIZE=$(stat -f%z "$PP_PATH" 2>/dev/null || stat -c%s "$PP_PATH" 2>/dev/null || echo "0")
          echo "Provisioning profile size: $PP_SIZE bytes"
          echo ""

          # 3) Test P12 validity with OpenSSL
          echo "🧪 Testing P12 certificate validity with OpenSSL..."
          if openssl pkcs12 -in "$CERTIFICATE_PATH" -nokeys -passin pass:"$P12_PASSWORD" >/dev/null 2>&1; then
            echo "✅ P12 certificate is valid and password is correct"
            echo "Certificate info:"
            openssl pkcs12 -in "$CERTIFICATE_PATH" -nokeys -passin pass:"$P12_PASSWORD" 2>/dev/null | openssl x509 -noout -subject -dates 2>/dev/null || echo "Cannot extract certificate details"
          else
            OPENSSL_EXIT=$?
            echo "❌ CRITICAL: P12 certificate validation FAILED (exit code: $OPENSSL_EXIT)"
            echo "   Possible causes:"
            echo "   - Invalid P12 file (corrupted or not a valid PKCS#12)"
            echo "   - Wrong P12_PASSWORD"
            echo "   - Expired certificate"
            exit 1
          fi
          echo ""

          # Create temporary keychain
          echo "🔑 Creating temporary keychain..."
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "✅ Keychain created and unlocked"
          echo ""

          # Import certificate to keychain
          echo "📥 Importing certificate into keychain..."
          if security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"; then
            echo "✅ Certificate imported successfully"
          else
            IMPORT_EXIT=$?
            echo "❌ CRITICAL: Certificate import FAILED (exit code: $IMPORT_EXIT)"
            exit 1
          fi
          
          # Set key partition list (critical for codesigning)
          echo "🔓 Setting key partition list for codesigning access..."
          if security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null 2>&1; then
            echo "✅ Key partition list configured"
          else
            echo "⚠️  Warning: set-key-partition-list failed (may cause signing issues)"
          fi
          echo ""
          
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          echo "✅ Keychain added to search list"
          echo ""

          # Apply provisioning profile
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/

          # Extract and display provisioning profile information...
          echo "📋 Extracting provisioning profile information..."

          # Decode provisioning profile to temporary plist file
          PP_PLIST_PATH=$RUNNER_TEMP/profile.plist
          security cms -D -i "$PP_PATH" > "$PP_PLIST_PATH" 2>/dev/null || echo "Failed to decode provisioning profile"

          # Extract information from the decoded plist
          if [ -f "$PP_PLIST_PATH" ]; then
            PP_UUID=$(plutil -extract UUID raw "$PP_PLIST_PATH" 2>/dev/null || echo "")
            PP_NAME=$(plutil -extract Name raw "$PP_PLIST_PATH" 2>/dev/null || echo "")
            PP_APP_ID=$(plutil -extract Entitlements.application-identifier raw "$PP_PLIST_PATH" 2>/dev/null || echo "")

            # Fallback using PlistBuddy if plutil fails
            if [ -z "$PP_UUID" ]; then
              PP_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" "$PP_PLIST_PATH" 2>/dev/null || echo "")
            fi
            if [ -z "$PP_NAME" ]; then
              PP_NAME=$(/usr/libexec/PlistBuddy -c "Print Name" "$PP_PLIST_PATH" 2>/dev/null || echo "")
            fi
            if [ -z "$PP_APP_ID" ]; then
              PP_APP_ID=$(/usr/libexec/PlistBuddy -c "Print Entitlements:application-identifier" "$PP_PLIST_PATH" 2>/dev/null || echo "")
            fi

            # Copy profile with UUID as filename for better recognition
            if [ -n "$PP_UUID" ]; then
              cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/$PP_UUID.mobileprovision
              echo "📋 Copied profile with UUID filename: $PP_UUID.mobileprovision"
            fi
          else
            PP_UUID=""
            PP_NAME=""
            PP_APP_ID=""
          fi

          echo "Profile UUID: ${PP_UUID:-'not found'}"
          echo "Profile Name: ${PP_NAME:-'not found'}"
          echo "App Identifier: ${PP_APP_ID:-'not found'}"

          # Export for Fastlane (only if not empty)
          if [ -n "$PP_UUID" ]; then
            echo "PROVISION_PROFILE_UUID=$PP_UUID" >> $GITHUB_ENV
          fi
          if [ -n "$PP_NAME" ]; then
            echo "PROVISION_PROFILE_NAME_ACTUAL=$PP_NAME" >> $GITHUB_ENV
          fi

          # Set as default keychain for this session
          security default-keychain -s $KEYCHAIN_PATH

          # Export paths for Fastlane (not used anymore but kept for compatibility)
          echo "BUILD_CERTIFICATE_PATH=$CERTIFICATE_PATH" >> $GITHUB_ENV
          echo "PROVISIONING_PROFILE_PATH=$PP_PATH" >> $GITHUB_ENV

          # 4) Verify signing identities are accessible
          echo "============================================"
          echo "🔍 Verifying Signing Identities"
          echo "============================================"
          
          echo "📋 Identities in temporary keychain ($KEYCHAIN_PATH):"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          KEYCHAIN_IDENTITIES=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -c "valid identities found")
          
          echo ""
          echo "📋 Identities in default keychain search list:"
          security find-identity -v -p codesigning
          DEFAULT_IDENTITIES=$(security find-identity -v -p codesigning | grep -o "[0-9]* valid identities found" || echo "0 valid identities found")
          
          echo ""
          echo "Summary:"
          echo "  Keychain-specific: $(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep "valid identities found" || echo "0 valid identities found")"
          echo "  Default search: $DEFAULT_IDENTITIES"
          
          if echo "$DEFAULT_IDENTITIES" | grep -q "0 valid identities"; then
            echo ""
            echo "❌ CRITICAL: No valid signing identities found!"
            echo "   This will cause the build to fail."
            echo ""
            echo "🔍 Debugging keychain state:"
            security list-keychains -d user
            echo ""
            security default-keychain
            echo ""
            echo "Attempting to re-add keychain to search list..."
            security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | grep -v "$KEYCHAIN_PATH" | xargs)
            echo ""
            echo "Retry identity check:"
            security find-identity -v -p codesigning
          else
            echo "✅ Signing identities are accessible"
          fi
          echo "============================================"
          echo ""

          echo "📋 Provisioning profile summary:"
          echo "  Profile Name: ${PP_NAME:-'not found'}"
          echo "  Profile UUID: ${PP_UUID:-'not found'}"
          echo "  App Identifier: ${PP_APP_ID:-'not found'}"

      - name: 'Setup Node.js'
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: 'Configure npm for GitHub Packages'
        run: |
          echo "@oxyfoo:registry=https://npm.pkg.github.com" > .npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.CICD_PAT }}" >> .npmrc

      - name: 'Install Node dependencies'
        run: npm ci

      - name: 'Setup Ruby'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: ios

      - name: 'Install CocoaPods'
        run: |
          cd ios
          # Clean pods to ensure fresh install
          rm -rf Pods Podfile.lock build
          bundle exec pod install --repo-update
        env:
          NO_FLIPPER: 1

      - name: 'Get config files'
        run: |
          echo ${{ secrets.APP_JSON }} | base64 -d > ./app.json

      - name: 'Set .env file'
        run: |
          ./Tools/Env/env.sh ${{ inputs.environment }}

      - name: 'Setup Bundle ID for test environment'
        if: inputs.environment == 'test'
        run: |
          # Bundle ID management is now handled by Fastlane
          echo "Bundle ID will be managed by Fastlane based on APP_IDENTIFIER environment variable"

      - name: 'Verify iOS deployment targets'
        run: |
          cd ios
          echo "Verifying iOS deployment targets for all pods..."
          # Check main project deployment target
          xcodebuild -showBuildSettings -project GameLife.xcodeproj -target GameLife | grep IPHONEOS_DEPLOYMENT_TARGET
          # Check if there are any pods with incorrect deployment targets
          if [ -f "Pods/Pods.xcodeproj/project.pbxproj" ]; then
            echo "Checking pods deployment targets..."
            grep -n "IPHONEOS_DEPLOYMENT_TARGET" Pods/Pods.xcodeproj/project.pbxproj | head -10
          fi

      - name: 'Pre-build diagnostics'
        run: |
          echo "=== System Info ==="
          sw_vers
          xcodebuild -version
          ruby --version
          bundler --version
          pod --version
          echo "=== Available SDKs ==="
          xcodebuild -showsdks
          echo "=== Signing Identities ==="
          security find-identity -v -p codesigning
          echo "=== Provisioning Profiles ==="
          ls -la ~/Library/MobileDevice/Provisioning\ Profiles/ || echo "No profiles found"

      - name: 'Derive APP_IDENTIFIER from Xcode project'
        run: |
          cd ios
          echo "============================================"
          echo "🔍 Detecting Bundle Identifier from Xcode project"
          echo "============================================"
          
          BID=$(xcodebuild -showBuildSettings -project GameLife.xcodeproj -target GameLife -configuration Release \
            | awk -F " = " '/PRODUCT_BUNDLE_IDENTIFIER/ {print $2; exit}')
          
          echo "Detected PRODUCT_BUNDLE_IDENTIFIER: $BID"
          
          if [ -z "$BID" ]; then
            echo "❌ Could not detect PRODUCT_BUNDLE_IDENTIFIER from Xcode project"
            echo "   This is critical - Fastlane needs the correct bundle ID"
            exit 1
          fi
          
          echo "✅ Bundle ID detected successfully: $BID"
          echo "APP_IDENTIFIER=$BID" >> $GITHUB_ENV
          echo ""
          echo "This value will be used by Fastlane (via ENV.fetch)"

      - name: 'Build with Fastlane'
        env:
          ENVFILE: .env
          FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APPLICATION_SPECIFIC_PASSWORD }}
          FASTLANE_SESSION: ${{ secrets.FASTLANE_SESSION }}
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          # Public configuration variables (APP_IDENTIFIER already set via $GITHUB_ENV from Xcode detection)
          TEAM_ID: ${{ vars.TEAM_ID }}
          ITC_TEAM_ID: ${{ vars.ITC_TEAM_ID }}
          # Sensitive information only
          APPLE_ID: ${{ secrets.APPLE_ID }}
          # Provisioning profile information
          PROVISION_PROFILE_UUID: ${{ env.PROVISION_PROFILE_UUID }}
          PROVISION_PROFILE_NAME_ACTUAL: ${{ env.PROVISION_PROFILE_NAME_ACTUAL }}
          # Use manual signing for CI
          USE_AUTOMATIC_SIGNING: "false"
          # Mark as CI environment
          CI: "true"
        run: |
          cd ios
          ENVIRONMENT="${{ inputs.environment }}"
          echo "Building for environment: $ENVIRONMENT"
          if [ -z "$ENVIRONMENT" ]; then
            echo "❌ Environment not specified, using 'dev' as default"
            bundle exec fastlane build environment:dev
          else
            bundle exec fastlane --verbose build environment:$ENVIRONMENT
          fi

      - name: 'Upload ipa artifact'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FILE_IPA }}
          path: ios/build/${{ env.FILE_IPA }}
          if-no-files-found: error

      - name: 'Upload build logs'
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ios-build-logs
          path: |
            ios/build/logs
            ~/Library/Logs/gym
          if-no-files-found: ignore

      - name: Dump gym log (tail)
        if: failure()
        run: |
          echo "=== Xcode Build Logs ==="
          if [ -d "ios/build/logs" ]; then
            find ios/build/logs -name "*.log" -exec tail -n 100 {} \;
          fi
          echo ""
          echo "=== Gym Logs ==="
          LG=$(ls -t ~/Library/Logs/gym 2>/dev/null | head -n1 || echo "")
          if [ -n "$LG" ]; then
            echo "=== 📝 $LG ==="
            # Show errors specifically
            grep -i "error:" ~/Library/Logs/gym/"$LG" | tail -50 || true
            echo "=== Last 250 lines ==="
            tail -n 250 ~/Library/Logs/gym/"$LG"
          else
            echo "No gym log produced"
          fi

      - name: 'Upload full gym log'
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: gym-full-log
          path: ~/Library/Logs/gym

      - name: 'Dump xcresult (if failure)'
        if: failure()
        run: |
          echo "=== Searching for .xcresult files ==="
          find ~/Library/Developer/Xcode/DerivedData -name "*.xcresult" -type d 2>/dev/null | while read xcresult; do
            echo "📦 Found: $xcresult"
            xcrun xcresulttool get --format json --path "$xcresult" 2>/dev/null | head -n 50 || echo "Cannot parse xcresult"
          done
          echo ""
          echo "=== Recent DerivedData builds ==="
          ls -lt ~/Library/Developer/Xcode/DerivedData/ 2>/dev/null | head -n 10 || echo "No DerivedData found"

  delivery:
    name: '📦 Delivery'
    if: inputs.delivery == true && inputs.environment != 'dev'
    runs-on: macos-latest
    needs: build
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: 'Get ipa artifact'
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.FILE_IPA }}
          path: .

      - name: 'Debug tree'
        run: |
          echo "::group::Workspace ls"
          ls -lsR
          echo "::endgroup::"

      - name: 'Setup Ruby'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: ios

      - name: 'Place IPA where Fastlane expects it'
        run: |
          mkdir -p build
          mv "${{ env.FILE_IPA }}" build/

      - name: 'Upload to App Store with Fastlane'
        env:
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}  
          APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APPLICATION_SPECIFIC_PASSWORD }}
          # Public configuration variables
          APP_IDENTIFIER: ${{ inputs.environment == 'test' && vars.APP_IDENTIFIER_TEST || vars.APP_IDENTIFIER }}
          TEAM_ID: ${{ vars.TEAM_ID }}
          ITC_TEAM_ID: ${{ vars.ITC_TEAM_ID }}
          # Sensitive information only
          APPLE_ID: ${{ secrets.APPLE_ID }}
        run: |
          cd ios
          bundle exec fastlane upload_to_appstore environment:${{ inputs.environment }}
