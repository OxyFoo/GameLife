name: '🧩 iOS Build & Delivery'

on:
  workflow_call:
    inputs:
      environment:
        description: 'Choose environment to deploy (test or prod)'
        required: true
        type: string
      delivery:
        description: 'Delivery to App Store Connect'
        required: false
        type: boolean
        default: false

env:
  FILE_IPA: GameLife-${{ inputs.environment }}.ipa
  PROVISION_PROFILE_NAME: ${{ inputs.environment == 'prod' && 'Game Life Distributed' || 'GameLife Test Profile' }}

jobs:
  build:
    name: '🏗️ Build'
    runs-on: macos-15
    timeout-minutes: 60
    environment: ${{ inputs.environment }}

    steps:
      - name: '🔍 Debug Workflow Context'
        run: |
          echo "============================================"
          echo "📊 Workflow Execution Context"
          echo "============================================"
          echo "Event name: ${{ github.event_name }}"
          echo "Ref: ${{ github.ref }}"
          echo "Ref name: ${{ github.ref_name }}"
          echo "Workflow: ${{ github.workflow }}"
          echo "Job: ${{ github.job }}"
          echo "Environment input: ${{ inputs.environment }}"
          echo "Actor: ${{ github.actor }}"
          echo "Run ID: ${{ github.run_id }}"
          echo "Run Number: ${{ github.run_number }}"
          echo "============================================"
          if [ "${{ github.event_name }}" = "workflow_call" ]; then
            echo "⚠️  This workflow is called via workflow_call"
            echo "⚠️  Ensure parent workflow uses 'secrets: inherit'"
          fi

      - name: '🚧 Check environment availability'
        run: |
          ENVIRONMENT="${{ inputs.environment }}"
          if [ "$ENVIRONMENT" != "prod" ] && [ "$ENVIRONMENT" != "test" ]; then
            echo "🚧 iOS build is only available for 'prod' and 'test' environments"
            echo "   Requested environment: '$ENVIRONMENT'"
            exit 1
          fi
          echo "✅ Environment '$ENVIRONMENT' is supported for iOS build"

      - name: 'Checkout repository'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          submodules: 'recursive'
          token: ${{ secrets.CICD_PAT }}

      - name: 'Setup Xcode'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'

      - name: 'Verify Xcode Selection'
        run: |
          echo "=== Current Xcode Selection ==="
          xcode-select -p
          xcodebuild -version
          echo "=== Available SDKs ==="
          xcodebuild -showsdks

      # ---------------------------
      # CERT + PROFILE INSTALLATION
      # ---------------------------
      - name: '🔐 Install Apple certificate and provisioning profile'
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_P12_PASSWORD }}
          PROVISION_PROFILE_BASE64: ${{ secrets.APPLE_PROVISION_PROFILE_BASE64 }}
          PROVISION_PROFILE_TEST_BASE64: ${{ secrets.APPLE_PROVISION_PROFILE_TEST_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail

          echo "============================================"
          echo "🔐 Certificate & Profile Installation"
          echo "============================================"

          # Secrets presence checks
          [ -n "${BUILD_CERTIFICATE_BASE64:-}" ] || (echo "❌ APPLE_CERTIFICATE_BASE64 is empty" && exit 1)
          [ -n "${P12_PASSWORD:-}" ] || (echo "❌ APPLE_P12_PASSWORD is empty" && exit 1)
          [ -n "${KEYCHAIN_PASSWORD:-}" ] || (echo "❌ APPLE_KEYCHAIN_PASSWORD is empty" && exit 1)

          ENVIRONMENT="${{ inputs.environment }}"
          if [ "$ENVIRONMENT" = "test" ]; then
            [ -n "${PROVISION_PROFILE_TEST_BASE64:-}" ] || (echo "❌ APPLE_PROVISION_PROFILE_TEST_BASE64 is empty" && exit 1)
          else
            [ -n "${PROVISION_PROFILE_BASE64:-}" ] || (echo "❌ APPLE_PROVISION_PROFILE_BASE64 is empty" && exit 1)
          fi

          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          PP_PATH="$RUNNER_TEMP/build_pp.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          echo "🔓 Decoding P12..."
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          ls -lh "$CERTIFICATE_PATH"
          file "$CERTIFICATE_PATH" || true

          echo "🔓 Decoding provisioning profile..."
          if [ "$ENVIRONMENT" = "test" ]; then
            echo -n "$PROVISION_PROFILE_TEST_BASE64" | base64 --decode > "$PP_PATH"
          else
            echo -n "$PROVISION_PROFILE_BASE64" | base64 --decode > "$PP_PATH"
          fi
          ls -lh "$PP_PATH"
          file "$PP_PATH" || true

          echo "🧪 Validating P12 password with OpenSSL..."
          openssl pkcs12 -in "$CERTIFICATE_PATH" -nokeys -passin pass:"$P12_PASSWORD" >/dev/null

          echo "🔑 Creating and unlocking temporary keychain..."
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Make keychain visible to codesign/xcodebuild
          echo "🔗 Adding keychain to search list and setting default..."
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"

          echo "📥 Importing P12 into keychain..."
          security import "$CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" -P "$P12_PASSWORD" -A -T /usr/bin/codesign -T /usr/bin/security

          echo "🔓 Setting key partition list (required for CI codesign)..."
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null

          echo "📦 Installing provisioning profile..."
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PP_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/"

          echo "📋 Decoding provisioning profile info..."
          PP_PLIST_PATH="$RUNNER_TEMP/profile.plist"
          security cms -D -i "$PP_PATH" > "$PP_PLIST_PATH"

          PP_UUID=$(plutil -extract UUID raw "$PP_PLIST_PATH" 2>/dev/null || true)
          PP_NAME=$(plutil -extract Name raw "$PP_PLIST_PATH" 2>/dev/null || true)
          PP_APP_ID=$(plutil -extract Entitlements.application-identifier raw "$PP_PLIST_PATH" 2>/dev/null || true)

          echo "Profile UUID: ${PP_UUID:-not found}"
          echo "Profile Name: ${PP_NAME:-not found}"
          echo "App Identifier: ${PP_APP_ID:-not found}"

          if [ -n "${PP_UUID:-}" ]; then
            cp "$PP_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PP_UUID.mobileprovision"
            echo "PROVISION_PROFILE_UUID=$PP_UUID" >> "$GITHUB_ENV"
          fi
          if [ -n "${PP_NAME:-}" ]; then
            echo "PROVISION_PROFILE_NAME_ACTUAL=$PP_NAME" >> "$GITHUB_ENV"
          fi

          echo "============================================"
          echo "🔍 Verifying signing identities"
          echo "============================================"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" || true
          security find-identity -v -p codesigning || true

          # Fail fast if no identity
          if security find-identity -v -p codesigning | grep -q "0 valid identities found"; then
            echo "❌ CRITICAL: 0 valid identities found AFTER import."
            echo "   Your P12 likely does NOT contain the private key or is not usable."
            exit 1
          fi

          echo "✅ Signing identities OK"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: 'Setup Node.js'
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: 'Configure npm for GitHub Packages'
        run: |
          echo "@oxyfoo:registry=https://npm.pkg.github.com" > .npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.CICD_PAT }}" >> .npmrc

      - name: 'Install Node dependencies'
        run: npm ci

      - name: 'Setup Ruby'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: ios

      - name: 'Install CocoaPods'
        env:
          NO_FLIPPER: 1
        run: |
          set -euo pipefail
          cd ios
          rm -rf Pods Podfile.lock build
          bundle exec pod install --repo-update

      - name: 'Get config files'
        run: |
          echo ${{ secrets.APP_JSON }} | base64 -d > ./app.json

      - name: 'Set .env file'
        run: |
          ./Tools/Env/env.sh ${{ inputs.environment }}

      - name: 'Pre-build diagnostics'
        run: |
          echo "=== Signing Identities (default search) ==="
          security find-identity -v -p codesigning || true
          echo "=== Provisioning Profiles ==="
          ls -la "$HOME/Library/MobileDevice/Provisioning Profiles/" || true

      # ---------------------------
      # FIX: DERIVE REAL BUNDLE ID
      # ---------------------------
      - name: 'Derive APP_IDENTIFIER from workspace+scheme (fail if NO/YES)'
        run: |
          set -euo pipefail
          cd ios

          echo "============================================"
          echo "🔍 Detecting PRODUCT_BUNDLE_IDENTIFIER"
          echo "============================================"

          BID=$(xcodebuild -workspace GameLife.xcworkspace -scheme GameLife -configuration Release -showBuildSettings \
            | awk -F " = " '/PRODUCT_BUNDLE_IDENTIFIER/ {print $2; exit}')

          echo "Detected PRODUCT_BUNDLE_IDENTIFIER: $BID"

          if [ -z "$BID" ]; then
            echo "❌ Could not detect PRODUCT_BUNDLE_IDENTIFIER"
            exit 1
          fi
          if [ "$BID" = "NO" ] || [ "$BID" = "YES" ]; then
            echo "❌ Detected an invalid bundle id value: $BID"
            echo "   This usually means your parsing caught a boolean setting, or the target/scheme is wrong."
            exit 1
          fi

          echo "✅ APP_IDENTIFIER=$BID"
          echo "APP_IDENTIFIER=$BID" >> "$GITHUB_ENV"

      # Optional: quick xcodebuild sanity (gives real errors)
      - name: 'Sanity archive with xcodebuild (prints real errors early)'
        run: |
          set -o pipefail
          cd ios
          xcodebuild -workspace GameLife.xcworkspace \
            -scheme GameLife \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$PWD/build/GameLife.xcarchive" \
            clean archive \
            | tee /tmp/xcodebuild.log
          echo "=== Last 60 lines ==="
          tail -n 60 /tmp/xcodebuild.log

      - name: 'Build with Fastlane'
        env:
          ENVFILE: .env
          FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APPLICATION_SPECIFIC_PASSWORD }}
          FASTLANE_SESSION: ${{ secrets.FASTLANE_SESSION }}
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          TEAM_ID: ${{ vars.TEAM_ID }}
          ITC_TEAM_ID: ${{ vars.ITC_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          PROVISION_PROFILE_UUID: ${{ env.PROVISION_PROFILE_UUID }}
          PROVISION_PROFILE_NAME_ACTUAL: ${{ env.PROVISION_PROFILE_NAME_ACTUAL }}
          USE_AUTOMATIC_SIGNING: "false"
          CI: "true"
          APP_IDENTIFIER: ${{ env.APP_IDENTIFIER }}
        run: |
          set -euo pipefail
          cd ios
          echo "Building for environment: ${{ inputs.environment }}"
          bundle exec fastlane --verbose build environment:${{ inputs.environment }}

      - name: 'Upload ipa artifact'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FILE_IPA }}
          path: ios/build/${{ env.FILE_IPA }}
          if-no-files-found: error

      - name: 'Upload build logs'
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ios-build-logs
          path: |
            /tmp/xcodebuild.log
            ios/build/logs
            ~/Library/Logs/gym
          if-no-files-found: ignore

      - name: Dump gym log (tail)
        if: failure()
        run: |
          echo "=== Gym Logs ==="
          LG=$(ls -t ~/Library/Logs/gym 2>/dev/null | head -n1 || true)
          if [ -n "${LG:-}" ]; then
            echo "=== 📝 $LG ==="
            grep -i "error:" ~/Library/Logs/gym/"$LG" | tail -80 || true
            echo "=== Last 250 lines ==="
            tail -n 250 ~/Library/Logs/gym/"$LG"
          else
            echo "No gym log produced"
          fi

      - name: 'Upload full gym log'
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: gym-full-log
          path: ~/Library/Logs/gym
          if-no-files-found: ignore

  delivery:
    name: '📦 Delivery'
    if: inputs.delivery == true && inputs.environment != 'dev'
    runs-on: macos-latest
    needs: build

    steps:
      - name: 'Checkout'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: 'Get ipa artifact'
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.FILE_IPA }}
          path: .

      - name: 'Debug tree'
        run: |
          echo "::group::Workspace ls"
          ls -lsR
          echo "::endgroup::"

      - name: 'Setup Ruby'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: ios

      - name: 'Place IPA where Fastlane expects it'
        run: |
          mkdir -p build
          mv "${{ env.FILE_IPA }}" build/

      - name: 'Upload to App Store with Fastlane'
        env:
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APPLICATION_SPECIFIC_PASSWORD }}
          APP_IDENTIFIER: ${{ inputs.environment == 'test' && vars.APP_IDENTIFIER_TEST || vars.APP_IDENTIFIER }}
          TEAM_ID: ${{ vars.TEAM_ID }}
          ITC_TEAM_ID: ${{ vars.ITC_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
        run: |
          set -euo pipefail
          cd ios
          bundle exec fastlane upload_to_appstore environment:${{ inputs.environment }}
