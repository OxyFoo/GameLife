name: '🧩 All tests'

on:
  workflow_call:
    inputs:
      environment:
        description: 'Environment to test (dev or prod)'
        required: true
        type: string
        default: 'dev'
      test-client:
        description: 'Run client tests'
        required: false
        type: boolean
        default: true
      test-resource:
        description: 'Run resource tests'
        required: false
        type: boolean
        default: true
      test-tls-pinning:
        description: 'Run TLS pinning tests'
        required: false
        type: boolean
        default: true

jobs:
  test-client:
    name: '📱 Client'
    if: ${{ inputs.test-client }}
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          token: ${{ secrets.CICD_PAT }}

      - name: 'Setup Node.js'
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: 'Cache NPM packages'
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: ${{ runner.os }}-node-

      - name: 'Configure npm for GitHub Packages'
        run: |
          echo "@oxyfoo:registry=https://npm.pkg.github.com" > .npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.CICD_PAT }}" >> .npmrc

      - name: 'Install Dependencies'
        run: npm install

      - name: 'Audit Dependencies'
        run: npm audit --omit=dev --audit-level=high

      - name: 'Run tests'
        env:
          ENVFILE: .env.local
        run: npm test

      - name: 'Run linter'
        run: npm run lint

      # TODO: Enable type checking after Avatar/Shop refactor
      # - name: 'Run typecheck'
      #   run: npm run typecheck

  test-ressource:
    name: '📦 Resources'
    if: ${{ inputs.test-resource }}
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          token: ${{ secrets.CICD_PAT }}

      - name: 'Run ressource tests'
        run: cd Tools/RessourcesChecker/ && python3 main.py

  test-tls-pinning:
    name: '🔐 TLS Pinning'
    if: ${{ inputs.test-tls-pinning }}
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          token: ${{ secrets.CICD_PAT }}

      - name: 'Set .env file'
        run: |
          ./Tools/Env/env.sh ${{ inputs.environment }}

      - name: 'Get server info & TLS Pinning Key'
        id: get-tls-pinning-key
        run: |
          echo "VPS_HOST=$(grep VPS_HOST .env | cut -d '=' -f2-)" >> $GITHUB_ENV
          echo "VPS_PORT=$(grep VPS_PORT .env | cut -d '=' -f2-)" >> $GITHUB_ENV
          echo "SSL_PINNING_PRIMARY_KEY=$(grep SSL_PINNING_PRIMARY_KEY .env | cut -d '=' -f2-)" >> $GITHUB_ENV

      - name: 'Run TLS Pinning Tests'
        env:
          VPS_HOST: ${{ env.VPS_HOST }}
          VPS_PORT: ${{ env.VPS_PORT }}
          SSL_PINNING_PRIMARY_KEY: ${{ env.SSL_PINNING_PRIMARY_KEY }}
        run: |
          echo "Running TLS Pinning Tests with key: $SSL_PINNING_PRIMARY_KEY"
          echo "VPS Host: $VPS_HOST"
          echo "VPS Port: $VPS_PORT"

          ./Tools/SSLPinning/test_ssl_pinning.sh "$SSL_PINNING_PRIMARY_KEY" "$VPS_HOST" "$VPS_PORT"
