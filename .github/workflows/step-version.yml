name: '🧩 Update version'

on:
  workflow_call:
    inputs:
      action-update:
        description: 'Update app version (none, build, build-android, build-ios, patch, minor, major)'
        type: string
        required: true

jobs:
  update-versions:
    name: '📝 Update version'
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: 'recursive'
          token: ${{ secrets.CICD_PAT }}

      - name: 'Update version'
        env:
          # `inputs`, not `github.event.inputs`: this is a reusable workflow, so the
          # caller's dispatch payload is not necessarily what was passed in `with:`.
          ACTION_UPDATE: ${{ inputs.action-update }}
        run: |
          # Update version for current branch
          NEWVERSION=$(./Tools/Version/version.sh "$ACTION_UPDATE" --version)
          echo "VERSION=$NEWVERSION" >> $GITHUB_ENV
          ./Tools/Version/version.sh "$ACTION_UPDATE" --force

          # Commit changes
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          git commit -m "📝 Update version to $NEWVERSION"
          git push
